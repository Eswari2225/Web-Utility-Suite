<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Projects</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #f6f8fb;
            --card: #ffffff;
            --accent: #2563eb;
            --muted: #6b7280;
            --shadow: 0 6px 18px rgba(30, 41, 59, 0.08);
            --radius: 14px;
        }
        body {
            font-family: 'Inter', system-ui, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            margin: 0;
            padding: 28px;
            color: #0f172a;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }
        h1 {
            font-size: 2rem;
        }
        #logout-btn {
            padding: 8px 16px;
            border-radius: 10px;
            border: 0;
            cursor: pointer;
            font-weight: 600;
            background-color: #ef4444;
            color: white;
        }
        .project-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 18px;
        }
        .project-card {
            background: var(--card);
            padding: 16px;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            text-decoration: none;
            color: inherit;
            transition: transform 0.2s ease-in-out;
        }
        .project-card:hover {
            transform: translateY(-5px);
        }
        .project-card h3 {
            margin: 0 0 8px;
            color: var(--accent);
        }
        .project-card p {
            margin: 0;
            color: var(--muted);
            font-size: 0.95rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>My Projects</h1>
            <button id="logout-btn">Logout</button>
        </header>

        <div class="project-grid" id="project-list">
            <!-- Projects will be dynamically inserted here -->
        </div>
    </div>

    <script>
        // Check if user is logged in, otherwise redirect to login page
        if (!localStorage.getItem('loggedInUser')) {
            window.location.href = 'login.html';
        }

        const projects = [
            { name: 'Hotel Website Demo', file: 'hotel.html', description: 'A responsive front-end for a hotel management system.' },
            { name: 'To-Do List', file: 'todo.html', description: 'A simple to-do list application to add and manage tasks.' },
            { name: 'Calculator', file: 'calculator.html', description: 'A functional calculator for basic arithmetic operations.' },
            { name: 'Digital Clock', file: 'timer.html', description: 'A real-time digital clock displaying the current time.' },
            { name: 'Color Changer', file: 'changeColor.html', description: 'A fun app that changes the background color randomly.' },
        ];

        const projectGrid = document.getElementById('project-list');

        projects.forEach(project => {
            const card = document.createElement('a');
            card.href = project.file;
            card.target = '_blank'; // Open in a new tab
            card.className = 'project-card';
            card.innerHTML = `
                <h3>${project.name}</h3>
                <p>${project.description}</p>
            `;
            projectGrid.appendChild(card);
        });

        document.getElementById('logout-btn').addEventListener('click', () => {
            localStorage.removeItem('loggedInUser');
            window.location.href = 'login.html';
        });
    </script>
</body>
</html>
