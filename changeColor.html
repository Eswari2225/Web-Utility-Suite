<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>changeColor</title>
    <style>
        button{
            background-color:white;
            color: black;
            font-size: 20px;

        }
        body{
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: white;
        }
    </style>
</head>
<body>
    <button id="click" onclick="change()">Click ME</button>
</body>

<script>
    var click = document.getElementById("click")
    function change(){
        var clr = randomColour();
        document.body.style.backgroundColor = clr

    }
    function randomColour(){
        var letters = '0123456789ABCDEF'
        var letter = "#"
        for(i=0; i<6; i++){
            var digits = Math.floor((Math.random()*16))
            letter+=letters[digits]
        }
        return letter;
    }
</script>
</html>
